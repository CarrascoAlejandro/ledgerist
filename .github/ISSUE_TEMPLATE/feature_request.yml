name: Feature idea
description: Suggest something Ledger could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, with no promise that any will be built — this is a
        personal project. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Ledger to do?
    validations:
      required: true
