name: CI

# Type-checks, tests and builds the web bundle on every push and PR.
# Kept deliberately cheap: no Electron or Gradle work here — the release
# workflow owns packaging, and this only has to catch broken source.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check all 7 tsconfigs
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build web bundle
        run: npm run build
